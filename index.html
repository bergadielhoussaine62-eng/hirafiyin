<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حرفيين القرية - سلا | إصلاح وصيانة منزلية</title>
    <!-- Tailwind CSS لتصميم عصري وسريع -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');
        body { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- Header / الهيدر -->
    <header class="bg-teal-700 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2 space-x-reverse">
                <i class="fa-solid font-bold text-2xl text-amber-400 fa-wrench"></i>
                <h1 class="text-xl font-extrabold tracking-wide">حرفيين القرية</h1>
            </div>
            <span class="bg-teal-800 text-teal-200 text-xs px-3 py-1 rounded-full font-medium">سلا - تجريبي مجاناً</span>
        </div>
    </header>

    <!-- Hero & Form Section / قسم الطلب -->
    <main class="max-w-2xl mx-auto px-4 py-6 w-full flex-grow">
        
        <!-- البانر الترحيبي -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 text-center mb-6">
            <h2 class="text-2xl font-bold text-slate-900 mb-2">خاصك معلم فـ القرية؟ 🛠️</h2>
            <p class="text-slate-600 text-sm leading-relaxed">
                بلومبي، تريسيان، صباغ ولا معلم إصلاح أجهزة.. كتوصل مع أفضل الحرفيين ولد الحومة بسرعة، والخدمة مجانية 100% حالياً!
            </p>
        </div>

        <!-- Form / استمارة الطلب -->
        <form id="serviceForm" onsubmit="sendToWhatsApp(event)" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-5">
            
            <!-- 1. اختيار الحرفة -->
            <div>
                <label class="block font-bold text-slate-700 mb-2">1. شنو الحرفة اللي محتاج؟</label>
                <div class="grid grid-cols-2 gap-3">
                    <label class="cursor-pointer">
                        <input type="radio" name="service" value="بلومبي (سباك)" class="peer hidden" required>
                        <div class="p-3 text-center rounded-xl border border-slate-200 peer-checked:border-teal-600 peer-checked:bg-teal-50 peer-checked:text-teal-700 font-medium transition-all flex flex-col items-center">
                            <i class="fa-solid fa-faucet-drip text-2xl mb-1 text-teal-600"></i>
                            <span>بلومبي (سباك)</span>
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="service" value="تريسيان (كهربائي)" class="peer hidden">
                        <div class="p-3 text-center rounded-xl border border-slate-200 peer-checked:border-teal-600 peer-checked:bg-teal-50 peer-checked:text-teal-700 font-medium transition-all flex flex-col items-center">
                            <i class="fa-solid fa-bolt text-2xl mb-1 text-amber-500"></i>
                            <span>تريسيان (كهربائي)</span>
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="service" value="صباغ وزليجي" class="peer hidden">
                        <div class="p-3 text-center rounded-xl border border-slate-200 peer-checked:border-teal-600 peer-checked:bg-teal-50 peer-checked:text-teal-700 font-medium transition-all flex flex-col items-center">
                            <i class="fa-solid fa-paint-roller text-2xl mb-1 text-indigo-500"></i>
                            <span>صباغ / زليجي</span>
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="service" value="إصلاح الأجهزة المنزلية" class="peer hidden">
                        <div class="p-3 text-center rounded-xl border border-slate-200 peer-checked:border-teal-600 peer-checked:bg-teal-50 peer-checked:text-teal-700 font-medium transition-all flex flex-col items-center">
                            <i class="fa-solid fa-plug text-2xl mb-1 text-rose-500"></i>
                            <span>إصلاح الأجهزة</span>
                        </div>
                    </label>
                </div>
            </div>

            <!-- 2. تحديد الحي فالقرية -->
            <div>
                <label class="block font-bold text-slate-700 mb-2">2. فين ساكن فالقرية؟</label>
                <select id="quarter" class="w-full p-3 rounded-xl border border-slate-200 focus:outline-none focus:border-teal-600 bg-slate-50 font-medium" required>
                    <option value="" disabled selected>اختار الحي بالضبط...</option>
                    <option value="القرية - بوشوك">بوشوك</option>
                    <option value="القرية - الحي المحمدي">الحي المحمدي</option>
                    <option value="القرية - با حماد">با حماد</option>
                    <option value="القرية - الواد">حي الواد</option>
                    <option value="القرية - السلام">حي السلام</option>
                    <option value="منطقة أخرى فالقرية">منطقة أخرى فالقرية</option>
                </select>
            </div>

            <!-- 3. وصف المشكل -->
            <div>
                <label class="block font-bold text-slate-700 mb-2">3. توضيح بسيط للمشكل:</label>
                <textarea id="description" rows="3" placeholder="مثلاً: السخان د الماء كيسيل، ولا الضو مقطوع فالمطبخ..." class="w-full p-3 rounded-xl border border-slate-200 focus:outline-none focus:border-teal-600 bg-slate-50 font-medium text-sm" required></textarea>
            </div>

            <!-- 4. معلومات الاتصال -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <div>
                    <label class="block font-bold text-slate-700 mb-1 text-sm">الاسم الكامل:</label>
                    <input type="text" id="clientName" placeholder="اسمك الكريم" class="w-full p-3 rounded-xl border border-slate-200 focus:outline-none focus:border-teal-600 bg-slate-50 font-medium text-sm" required>
                </div>
                <div>
                    <label class="block font-bold text-slate-700 mb-1 text-sm">رقم الهاتف:</label>
                    <input type="tel" id="clientPhone" placeholder="06XXXXXXXX" class="w-full p-3 rounded-xl border border-slate-200 focus:outline-none focus:border-teal-600 bg-slate-50 font-medium text-sm" required>
                </div>
            </div>

            <!-- زر الإرسال -->
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-emerald-600/20 transition-all flex items-center justify-center space-x-2 space-x-reverse text-base">
                <i class="fa-brands fa-whatsapp text-xl"></i>
                <span>اطلب المعلم دابا عبر الواتساب</span>
            </button>
            <p class="text-xs text-center text-slate-400">الدفع كاش يداً بيد للمعلم بعد المعاينة والإصلاح 🤝</p>
        </form>

    </main>

    <!-- Footer / الفوتر -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500">
        <p>منصة حرفيين القرية - سلا © 2026 | خدمة سريعة ومباشرة</p>
    </footer>

    <!-- JavaScript للربط مع الواتساب -->
    <script>
        function sendToWhatsApp(e) {
            e.preventDefault();

            // رقم تلفونك أو رقم الإدارة اللي غتوصل فيه الطلبات فالأول
            const adminPhoneNumber = "212600000000"; // غيّر هاد الرقم برقمك أنت (بدون +)

            const service = document.querySelector('input[name="service"]:checked')?.value || "خدمة عامة";
            const quarter = document.getElementById('quarter').value;
            const description = document.getElementById('description').value;
            const clientName = document.getElementById('clientName').value;
            const clientPhone = document.getElementById('clientPhone').value;

            // تنسيق الرسالة اللي غتوصلك فالواتساب
            const message = `طلب خدمة جديد من منصة القرية 🛠️%0A%0A` +
                            `👤 *الزبون:* ${clientName}%0A` +
                            `📞 *التلفون:* ${clientPhone}%0A` +
                            `🔧 *الخدمة:* ${service}%0A` +
                            `📍 *المنطقة:* ${quarter}%0A` +
                            `📝 *تفاصيل المشكل:* ${description}%0A%0A` +
                            `_الرجاء التواصل مع الزبون لتأكيد الموعد والمعاينة._`;

            // فتح الواتساب مباشرة
            const whatsappUrl = `https://wa.me/${adminPhoneNumber}?text=${message}`;
            window.open(whatsappUrl, '_blank');
        }
    </script>
</body>
</html>
