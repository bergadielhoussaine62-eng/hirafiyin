<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حرفيين القرية - سلا | إصلاح وصيانة منزلية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');
        body { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-teal-700 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2 space-x-reverse">
                <span class="text-2xl">🛠️</span>
                <h1 class="text-xl font-extrabold tracking-wide">حرفيين القرية</h1>
            </div>
            <span class="bg-teal-800 text-teal-200 text-xs px-3 py-1 rounded-full font-medium">سلا - تجريبي مجاناً</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-2xl mx-auto px-4 py-6 w-full flex-grow">
        
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 text-center mb-6">
            <h2 class="text-2xl font-bold text-slate-900 mb-2">خاصك معلم فـ القرية؟ 🏠</h2>
            <p class="text-slate-600 text-sm leading-relaxed">
                اختار الخدمة، الحي، والمعلم اللي يناسبك فـ القرية وتواصل معاه مباشرة!
            </p>
        </div>

        <form id="serviceForm" onsubmit="handleFormSubmit(event)" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-5">
            
            <!-- 1. اختيار الحرفة -->
            <div>
                <label class="block font-bold text-slate-700 mb-2">1. شنو الحرفة اللي محتاج؟</label>
                <div class="grid grid-cols-2 gap-3">
                    <label class="cursor-pointer">
                        <input type="radio" name="service" value="بلومبي" class="peer hidden" required onchange="filterHandymen()">
                        <div class="p-3 text-center rounded-xl border border-slate-200 peer-checked:border-teal-600 peer-checked:bg-teal-50 peer-checked:text-teal-700 font-medium transition-all flex flex-col items-center">
                            <span class="text-2xl mb-1">💧</span>
                            <span>بلومبي (سباك)</span>
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="service" value="تريسيان" class="peer hidden" onchange="filterHandymen()">
                        <div class="p-3 text-center rounded-xl border border-slate-200 peer-checked:border-teal-600 peer-checked:bg-teal-50 peer-checked:text-teal-700 font-medium transition-all flex flex-col items-center">
                            <span class="text-2xl mb-1">⚡</span>
                            <span>تريسيان (كهربائي)</span>
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="service" value="صباغ" class="peer hidden" onchange="filterHandymen()">
                        <div class="p-3 text-center rounded-xl border border-slate-200 peer-checked:border-teal-600 peer-checked:bg-teal-50 peer-checked:text-teal-700 font-medium transition-all flex flex-col items-center">
                            <span class="text-2xl mb-1">🎨</span>
                            <span>صباغ / زليجي</span>
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="service" value="إصلاح الأجهزة" class="peer hidden" onchange="filterHandymen()">
                        <div class="p-3 text-center rounded-xl border border-slate-200 peer-checked:border-teal-600 peer-checked:bg-teal-50 peer-checked:text-teal-700 font-medium transition-all flex flex-col items-center">
                            <span class="text-2xl mb-1">🔌</span>
                            <span>إصلاح الأجهزة</span>
                        </div>
                    </label>
                </div>
            </div>

            <!-- 2. تحديد الحي + خريطة Google Maps -->
            <div>
                <label class="block font-bold text-slate-700 mb-2">2. فين ساكن فالقرية؟</label>
                <select id="quarter" class="w-full p-3 rounded-xl border border-slate-200 focus:outline-none focus:border-teal-600 bg-slate-50 font-medium mb-3" required>
                    <option value="" disabled selected>اختار الحي...</option>
                    <option value="بوشوك">بوشوك</option>
                    <option value="الحي المحمدي">الحي المحمدي</option>
                    <option value="با حماد">با حماد</option>
                    <option value="حي الواد">حي الواد</option>
                    <option value="حي السلام">حي السلام</option>
                </select>

                <!-- زر تحديد الموقع على الخريطة GPS -->
                <button type="button" onclick="getLocation()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2.5 px-4 rounded-xl border border-slate-300 transition-all flex items-center justify-center space-x-2 space-x-reverse text-sm">
                    <span>📍 حدد موقعك بالضبط (Google Maps)</span>
                </button>
                <input type="hidden" id="locationUrl">
                <p id="locationStatus" class="text-xs text-emerald-600 mt-1 font-medium hidden">✓ تم تحديد موقعك بنجاح!</p>
            </div>

            <!-- 3. توضيح المشكل + تسجيل صوتي (Audio) -->
            <div>
                <label class="block font-bold text-slate-700 mb-2">3. توضيح المشكل (كتابة أو أوديو):</label>
                <textarea id="description" rows="2" placeholder="اكتب هنا شنو عندك..." class="w-full p-3 rounded-xl border border-slate-200 focus:outline-none focus:border-teal-600 bg-slate-50 font-medium text-sm mb-2"></textarea>
                
                <!-- زر التسجيل الصوتي -->
                <div class="flex items-center space-x-2 space-x-reverse">
                    <button type="button" id="recordBtn" onclick="toggleRecording()" class="bg-rose-50 text-rose-600 hover:bg-rose-100 px-3 py-2 rounded-xl text-xs font-bold border border-rose-200 transition-all flex items-center space-x-1 space-x-reverse">
                        <span>🎙️ سجل أوديو يشرح المشكل</span>
                    </button>
                    <span id="recordingStatus" class="text-xs text-slate-500"></span>
                </div>
            </div>

            <!-- 4. الاسم والتلفون -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <div>
                    <label class="block font-bold text-slate-700 mb-1 text-sm">الاسم الكامل:</label>
                    <input type="text" id="clientName" placeholder="اسمك الكريم" class="w-full p-3 rounded-xl border border-slate-200 focus:outline-none focus:border-teal-600 bg-slate-50 font-medium text-sm" required>
                </div>
                <div>
                    <label class="block font-bold text-slate-700 mb-1 text-sm">رقم الهاتف:</label>
                    <input type="tel" id="clientPhone" placeholder="06XXXXXXXX" class="w-full p-3 rounded-xl border border-slate-200 focus:outline-none focus:border-teal-600 bg-slate-50 font-medium text-sm" required>
                </div>
            </div>

            <!-- 5. قائمة الأصطاوات والمعالمية (List of Handymen) -->
            <div class="pt-4 border-t border-slate-200">
                <label class="block font-bold text-slate-800 mb-3 text-base">4. اختار المعلم اللي بغيتي فـ القرية:</label>
                
                <div id="handymenList" class="space-y-3">
                    <p class="text-sm text-slate-400 text-center py-2">اختار الحرفة الفوق باش يطلعو ليك المعالمية المتاحين..</p>
                </div>
            </div>

        </form>

    </main>

    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500">
        <p>منصة حرفيين القرية - سلا © 2026</p>
    </footer>

    <script>
        // قائمة المعلمين فالقرية (تقدر تزيد ولا تبدل أرقامهم وأسمائهم هنا بسهولة)
        const handymenData = [
            { id: 1, name: "المعلم مصطفى", service: "بلومبي", phone: "212600000000", quarter: "بوشوك", rating: "4.9 ⭐", img: "https://cdn-icons-png.flaticon.com/512/3135/3135715.png" },
            { id: 2, name: "المعلم رشيد", service: "تريسيان", phone: "212600000000", quarter: "الحي المحمدي", rating: "4.8 ⭐", img: "https://cdn-icons-png.flaticon.com/512/3135/3135715.png" },
            { id: 3, name: "المعلم حسن", service: "صباغ", phone: "212600000000", quarter: "حي الواد", rating: "5.0 ⭐", img: "https://cdn-icons-png.flaticon.com/512/3135/3135715.png" },
            { id: 4, name: "المعلم ياسين", service: "إصلاح الأجهزة", phone: "212600000000", quarter: "با حماد", rating: "4.7 ⭐", img: "https://cdn-icons-png.flaticon.com/512/3135/3135715.png" }
        ];

        let selectedHandymanPhone = "";

        // فلترة وعرض المعالمية
        function filterHandymen() {
            const selectedService = document.querySelector('input[name="service"]:checked')?.value;
            const container = document.getElementById('handymenList');
            container.innerHTML = "";

            const filtered = handymenData.filter(h => h.service === selectedService);

            if (filtered.length === 0) {
                container.innerHTML = `<p class="text-sm text-slate-500 text-center">ما كاين حتى معلم متاح حالياً ف هاد الحرفة.</p>`;
                return;
            }

            filtered.forEach(h => {
                const card = `
                    <div class="border border-slate-200 rounded-xl p-3 flex items-center justify-between hover:border-teal-500 transition-all bg-slate-50">
                        <div class="flex items-center space-x-3 space-x-reverse">
                            <img src="${h.img}" class="w-10 h-10 rounded-full border">
                            <div>
                                <h4 class="font-bold text-slate-800 text-sm">${h.name}</h4>
                                <p class="text-xs text-slate-500">${h.service} - ${h.quarter} | ${h.rating}</p>
                            </div>
                        </div>
                        <button type="button" onclick="selectHandyman('${h.phone}', '${h.name}')" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold py-2 px-3 rounded-lg shadow-sm flex items-center space-x-1 space-x-reverse">
                            <span>اطلبو ف الواتساب</span>
                        </button>
                    </div>
                `;
                container.innerHTML += card;
            });
        }

        // إيجاد اللوكيشن عن طريق Google Maps GPS
        function getLocation() {
            const status = document.getElementById('locationStatus');
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    document.getElementById('locationUrl').value = `https://maps.google.com/?q=${lat},${lng}`;
                    status.classList.remove('hidden');
                }, () => {
                    alert("تعذر تحديد موقعك تلقائياً، تأكد من تشغيل GPS.");
                });
            }
        }

        // أوديو بسيط
        let isRecording = false;
        function toggleRecording() {
            const status = document.getElementById('recordingStatus');
            if (!isRecording) {
                isRecording = true;
                status.innerText = "🔴 جاري التسجيل... (تكلم دابا)";
            } else {
                isRecording = false;
                status.innerText = "🟢 تم تسجيل الأوديو بنجاح!";
            }
        }

        // إرسال الطلب للمعلم المحدد مباشرة
        function selectHandyman(phone, handymanName) {
            const service = document.querySelector('input[name="service"]:checked')?.value || "";
            const quarter = document.getElementById('quarter').value;
            const description = document.getElementById('description').value || "بدون توضيح مكتوب";
            const clientName = document.getElementById('clientName').value;
            const clientPhone = document.getElementById('clientPhone').value;
            const locationUrl = document.getElementById('locationUrl').value;

            if(!clientName || !clientPhone || !quarter) {
                alert("عافاك كمل الاسم، رقم التلفون، واختار الحي فالأول!");
                return;
            }

            let msg = `السلام عليكم ${handymanName}، جاني طلب من منصة *حرفيين القرية* 🛠️%0A%0A` +
                      `👤 *الزبون:* ${clientName}%0A` +
                      `📞 *التلفون:* ${clientPhone}%0A` +
                      `🔧 *الخدمة:* ${service}%0A` +
                      `📍 *الحي:* ${quarter}%0A` +
                      `📝 *تفاصيل:* ${description}%0A`;

            if(locationUrl) {
                msg += `🗺️ *الموقع ف الخريطة:* ${locationUrl}%0A`;
            }

            window.open(`https://wa.me/${phone}?text=${msg}`, '_blank');
        }

        function handleFormSubmit(e) { e.preventDefault(); }
    </script>
</body>
</html>
